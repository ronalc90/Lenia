<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bioluma" />
    <!-- iOS would otherwise turn large essence numbers into phone links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Bioluma — un incremental de vida artificial: siembra materia, descubre especies de Lenia, provoca una extinción y vuelve con mejores genes." />
    <title>Bioluma</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Fonts are served by the game itself (docs/ARTE-PULIDO.md §7.1): Fraunces for titles, Inter for the
         UI, JetBrains Mono for instruments, latin subsets as variable woff2 (OFL 1.1, public/fonts/OFL-*.txt,
         CREDITS.md). The two the first screen needs are preloaded; the service worker keeps them offline. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/fraunces-latin.57f703d5.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/inter-latin.3100e775.woff2" />
    <style>
      @font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 500 800; font-display: swap; src: url('./fonts/fraunces-latin.57f703d5.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 500 700; font-display: swap; src: url('./fonts/fraunces-latin-italic.32216cad.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 800; font-display: swap; src: url('./fonts/inter-latin.3100e775.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 500 700; font-display: swap; src: url('./fonts/jetbrains-mono-latin.83c005d4.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Metric-matched fallbacks: while a font loads (or offline before the first visit is cached) the
         fallback has the same line metrics, so the swap never moves text vertically. Fraunces: ascent
         1956 / descent 510 per 2000 units (hhea), x-height 0.482 ≈ Georgia's 0.481, so no size change. */
      @font-face { font-family: 'Inter Fallback'; src: local('Arial'), local('Helvetica'), local('Liberation Sans'), local('Roboto'); size-adjust: 107.6%; ascent-override: 90.4%; descent-override: 22.5%; line-gap-override: 0%; }
      @font-face { font-family: 'JetBrains Mono Fallback'; src: local('Courier New'), local('Liberation Mono'), local('DejaVu Sans Mono'), local('Menlo'); size-adjust: 100%; ascent-override: 102%; descent-override: 30%; line-gap-override: 0%; }
      @font-face { font-family: 'Fraunces Fallback'; src: local('Georgia'), local('Times New Roman'), local('Noto Serif'), local('DejaVu Serif'); size-adjust: 100%; ascent-override: 97.8%; descent-override: 25.5%; line-gap-override: 0%; }
      html, body { margin: 0; height: 100%; background: #0B0E12; color: #E6EDF3; overscroll-behavior: none; }
      body { font-family: Inter, 'Inter Fallback', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px/1.4 Inter, 'Inter Fallback', system-ui, sans-serif; color: #8B98A5; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">BIOLUMA</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
