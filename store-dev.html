<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E12" />
    <link rel="icon" href="data:," />
    <title>Bioluma Store Dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e12;
        color: #e6edf3;
        font-family: Inter, system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(60% 50% at 50% 40%, rgba(91, 192, 235, 0.08), transparent 70%),
          #0b0e12;
      }
      .dev-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 16px;
        max-width: 720px;
      }
      .dev-panel h1 {
        width: 100%;
        margin: 0;
        font-size: 18px;
      }
      .dev-panel p {
        width: 100%;
        margin: 0 0 6px;
        color: #8b98a5;
        font: 12px/1.4 'JetBrains Mono', monospace;
      }
      .dev-panel button {
        min-height: 48px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid rgba(230, 237, 243, 0.14);
        background: #1b232c;
        color: #e6edf3;
        font: 600 14px Inter, system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/store/dev.ts"></script>
  </body>
</html>
